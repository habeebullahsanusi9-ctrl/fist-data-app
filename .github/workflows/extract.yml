name: Extract FIST DATA App

on:
  push:
    paths:
      - ".github/workflows/extract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Extract FIST DATA ZIP
        run: |
          if [ ! -f "fist-data-fixed-build.zip" ]; then
            echo "FIST DATA ZIP file not found!"
            exit 1
          fi

          mkdir -p /tmp/fist-data-app
          unzip -o -q fist-data-fixed-build.zip -d /tmp/fist-data-app

          APP_DIR=$(dirname "$(find /tmp/fist-data-app -name package.json -print -quit)")

          if [ -z "$APP_DIR" ] || [ "$APP_DIR" = "/tmp" ]; then
            echo "Could not find package.json inside the ZIP."
            exit 1
          fi

          cp -a "$APP_DIR"/. .

      - name: Save extracted app files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract FIST DATA app files"
            git push
          else
            echo "No new files to save."
          fi
